  <div id="stage">
    <!-- 배경 투명. ?bg=1 로 열면 위치 확인용 목업 배경 표시 -->
    <div class="backdrop" id="backdrop" hidden></div>
    <!-- 중앙 우측 = 버츄얼 캐릭터 자리 (요소 침범 금지, 자리만 존재) -->
    <div id="board"></div>
    <div id="pieces"></div>

    <!-- 전광판 (세로형 결과판) -->
    <div class="scoreboard" id="scoreboard" hidden>
      <div class="queue" id="sbQueue">대기 0건</div>
      <div class="die disp" id="sbDie">?</div>
      <div class="nick disp" id="sbNick">&nbsp;</div>
      <div class="dest" id="sbDest">굴림을 기다리는 중</div>
      <div class="effect" id="sbEffect" hidden>
        <div class="fx-rule" id="fxRule"></div>
        <div class="fx-flush disp" id="fxFlush" hidden></div>
        <div class="fx-hint" id="fxHint"></div>
      </div>
      <div class="hist" id="sbHist"></div>
    </div>

    <!-- 미니 상태바 -->
    <div class="statusbar" id="statusbar" hidden></div>
    <!-- 타이머 칩 (시간제 벌칙 중에만) -->
    <div class="timerdock" id="timerdock"></div>
    <!-- 방어권 선물/사용 토스트 -->
    <div class="toast disp" id="toast" hidden></div>

    <div class="mgwin" id="minigame" hidden>
      <div class="mg-title disp" id="mgwTitle">사다리타기</div>
      <div id="mgwBody"></div>
    </div>
  </div>
